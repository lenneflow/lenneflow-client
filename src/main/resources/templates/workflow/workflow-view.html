<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Lenneflow Client</title>

    <style type="text/css">
        .end-element { fill : #FFCCFF; }
    </style>
    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <!-- Custom styles for this page -->
    <link href="/vendor/datatables/dataTables.bootstrap4.min.css" rel="stylesheet">

    <!-- fontawesome-free -->
    <link rel="stylesheet" href="/vendor/fontawesome-free/css/all.css">
</head>
<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <div th:insert="sidebar :: sidebar"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <div th:insert="navheader :: navheader"></div>
            <!-- Page Heading -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h3>&nbsp;Workflow Details View</h3>
                <a type="button" th:href="@{/workflow/{uid}/step/new(uid=${workflow.uid})}" class="btn btn-info btn-sm">Add Workflow Step</a>
            </div>
            <div style="background-color: #fadf9b">
                <h1 style="color: darkblue; text-align: center;" th:text=" ${workflow.name}"></h1>
            </div>
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <div style="background-color: white" class="row">
                    <div class="col border">
                    <input type="hidden" id="chartsCodeId" th:value="${chartsCode}"/>
                        <h3 class="h5 mb-0 text-gray-800">&nbsp;</h3>
                        <a style="text-align: right" type="button" th:href="@{/workflow/{uid}/step/new(uid=${workflow.uid})}" class="btn btn-info btn-sm">Add Workflow Step</a>
                        <h3 class="h5 mb-0 text-gray-800">&nbsp;</h3>
                        <div style="text-align: center;" id="canvas"></div>
                    </div>
                    <div class="col border">
                        <h3 class="h5 mb-0 text-gray-800">&nbsp;</h3>
                        <h3 class="h5 mb-0 text-gray-800">Payload<a type="button" onclick="copyToClipboard()" data-toggle="tooltip" data-placement="button" title="Copy to Clipboard" class="btn btn-light btn-sm fa fa-copy"></a></h3>
                        <h3 class="h5 mb-0 text-gray-800">&nbsp;</h3>
                        <pre class="copy-input" style="font-family: Garamond,serif;"></pre>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>

<script src="http://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="http://flowchart.js.org/flowchart-latest.js"></script>

<script src="https://unpkg.com/json-format-highlight@1.0.4/dist/json-format-highlight.js"></script>
<script th:inline="javascript">
    function highlight() {
        const payload = /*[[${payload}]]*/ '{}';
        const indented = JSON.stringify(JSON.parse(payload), null, 2);
        document.querySelector("pre").innerHTML = jsonFormatHighlight(indented);
    }
    highlight();
</script>

<script src="/vendor/jquery.scrollTo.min.js"></script>

<script src="/vendor/svg.js"></script>

<script src="/vendor/flowsvg.min.js"></script>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

<script>
    window.onload = function () {
        var chart;
        var code = $("#chartsCodeId").val();

        if (chart) {
            chart.clean();
        }

        chart = flowchart.parse(code);
        chart.drawSVG('canvas', {
            // 'x': 30,
            // 'y': 50,
            'line-width': 2,
            'maxWidth': 5,//ensures the flowcharts fits within a certian width
            'line-length': 50,
            'text-margin': 10,
            'font-size': 14,
            'font': 'normal',
            'font-family': 'Garamond',
            'font-weight': 'bold',
            'font-color': 'black',
            'line-color': 'black',
            'element-color': 'black',
            'fill': 'white',
            'yes-text': 'yes',
            'no-text': 'no',
            'arrow-end': 'block',
            'scale': 1,
            'symbols': {
                'start': {
                    //'font-color': 'red',
                    'element-color': 'black',
                    'fill': 'yellow'
                },
                'end':{
                    //'font-color': 'red',
                    'element-color': 'black',
                    'fill': 'blue'
                }
            },
            'flowstate' : {
                'past' : { 'fill' : '#CCCCCC', 'font-size' : 12},
                'current' : {'fill' : 'yellow', 'font-color' : 'red', 'font-weight' : 'bold'},
                'future' : { 'fill' : '#FFFF99'},
                'request' : { 'fill' : 'blue'},
                'invalid': {'fill' : '#444444'},
                'approved' : { 'fill' : '#58C4A3', 'font-size' : 12, 'yes-text' : 'APPROVED', 'no-text' : 'n/a' },
                'rejected' : { 'fill' : '#C45879', 'font-size' : 12, 'yes-text' : 'n/a', 'no-text' : 'REJECTED' }
            }
        });

    };

    function myFunction(event, node) {
        console.log("You just clicked this node:", node);
    }
</script>
<script>
    const copyToClipboard = async () => {
        try {
            const element = document.querySelector(".copy-input");
            await navigator.clipboard.writeText(element.textContent);
            console.log("Text copied to clipboard!");
        } catch (error) {
            console.error("Failed to copy to clipboard:", error);
            // Optional: Display an error message to the user
        }
    };
</script>

</html>
